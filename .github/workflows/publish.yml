name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Configure Maven settings
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${SONATYPE_USERNAME}</username>
                <password>${SONATYPE_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
      - name: Import GPG signing key
        if: ${{ env.SONATYPE_USERNAME != '' }}
        run: echo "$SIGNING_KEY" | gpg --batch --yes --import
      - name: Publish to Maven Central
        if: ${{ env.SONATYPE_USERNAME != '' && env.SONATYPE_PASSWORD != '' }}
        run: ./mvnw -B -Pcentral deploy
      - name: Publish to GitHub Packages
        if: ${{ env.SONATYPE_USERNAME == '' || env.SONATYPE_PASSWORD == '' }}
        run: ./mvnw -B deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/allbegray/totp
